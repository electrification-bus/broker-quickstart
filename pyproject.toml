[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebus-broker-quickstart"
version = "0.0.1"
description = "eBus MQTT broker quickstart: host-native Mosquitto with mDNS discovery and mTLS"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Electrification Bus contributors" }]

dependencies = [
    "jinja2>=3.1",
    "cryptography>=42.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
# Host-native laptop deployment (Mac MVP): mDNS advertising and discovery via
# ebus-service-discovery (python-zeroconf, which pulls in ifaddr, which
# laptop/certs.py also uses for SAN IP enumeration).
laptop = [
    "ebus-service-discovery[zeroconf]>=0.5.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ebus-laptop = "laptop.run:main"

[tool.hatch.build.targets.wheel]
packages = ["mdns", "laptop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["laptop/tests"]
# `live` tests start a real Mosquitto broker (system binary, not a Python
# dependency), so they are opt-in: `pytest -m live`.
markers = ["live: requires a running Mosquitto broker binary"]
addopts = "-m 'not live'"
